<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rang De — How it works v2</title>
<!-- Same three families the site loads via next/font: Inter (display), Parkinsans (eyebrow), Geist (body). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Parkinsans:wght@500;600&family=Geist:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Site tokens (app/globals.css) ---------- */
  :root{
    --primary:#0DAADE; --blue-deep:#00517A;
    --green:#8CA21E; --green-dark:#3A6E0C; --green-bright:#62AF1D;
    --ink:#292D36;
    --ink-64:rgba(41,45,54,.64); --ink-48:rgba(41,45,54,.48); --ink-32:rgba(41,45,54,.32);
    --ink-24:rgba(41,45,54,.24); --ink-16:rgba(41,45,54,.16); --ink-8:rgba(41,45,54,.08); --ink-4:rgba(41,45,54,.04);
    --bg-grey:#F1F2F5;
    --green-8:rgba(140,162,30,.08); --green-16:rgba(140,162,30,.16); --green-24:rgba(140,162,30,.24);
    --primary-16:rgba(13,170,222,.16);
    --card-shadow:0 1px 2px rgba(41,45,54,.06), 0 6px 20px rgba(41,45,54,.10);
    --sheet-shadow:0 24px 48px rgba(3,21,56,.24);
    --ease:cubic-bezier(.22,1,.36,1);          /* site motion: smooth ease-out, no bounce */
    --ease-io:cubic-bezier(.65,0,.35,1);       /* morphs: in-out, like the motion study */
    --f-display:"Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --f-eyebrow:"Parkinsans","Inter",sans-serif;
    --f-body:"Geist","Inter",sans-serif;
    --page-bg:var(--bg-grey); --page-ink:var(--ink); --page-mute:var(--ink-64);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --page-bg:#16181D; --page-ink:#ECEDF0; --page-mute:rgba(236,237,240,.64); }
  }
  :root[data-theme="dark"]{ --page-bg:#16181D; --page-ink:#ECEDF0; --page-mute:rgba(236,237,240,.64); }

  *,*::before,*::after{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{ margin:0; min-height:100vh; background:var(--page-bg); color:var(--page-ink); font-family:var(--f-body);
        display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; }

  /* prototype-only controls, outside the product frame */
  .head{ text-align:center; max-width:390px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .head h1{ font:700 15px/20px var(--f-display); margin:0; }
  .head p{ font:500 12px/16px var(--f-display); margin:0; color:var(--page-mute); }
  .tools{ display:flex; align-items:center; gap:8px; }
  .vsw{ display:inline-flex; background:var(--ink-8); border-radius:999px; padding:2px; }
  .vsw button,.rp{ font:700 10px/12px var(--f-display); letter-spacing:.88px; text-transform:uppercase; border:0; cursor:pointer; border-radius:999px; }
  .vsw button{ background:transparent; color:var(--page-mute); padding:6px 10px; }
  .vsw button.on{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(41,45,54,.16); }
  .rp{ color:var(--page-mute); background:var(--ink-8); padding:8px 12px; }

  /* ---------- product frame: the modal's mobile sheet ---------- */
  .card{ width:min(390px,100%); height:816px; background:#fff; border-radius:16px; padding:8px; box-shadow:var(--sheet-shadow);
         display:flex; flex-direction:column; gap:8px; color:var(--ink); }
  /* Illustration band: Stripe-style soft colour glow (site green + blue) that drifts slowly. */
  .vis{ height:58%; flex:none; position:relative; border-radius:8px; overflow:hidden; background:#FAFBF8; isolation:isolate; }
  .vis::before{ content:""; position:absolute; inset:-20%; z-index:-1;
    background:
      radial-gradient(42% 38% at 18% 14%, rgba(98,175,29,.20), transparent 70%),
      radial-gradient(40% 36% at 86% 86%, rgba(13,170,222,.16), transparent 70%),
      radial-gradient(30% 30% at 80% 18%, rgba(140,162,30,.10), transparent 70%);
    animation:drift 14s ease-in-out infinite alternate; }
  @keyframes drift{ to{ transform:translate(4%, -3%) rotate(6deg); } }
  .stage{ position:absolute; inset:0; animation:stageIn .5s var(--ease) backwards; transition:opacity .22s, filter .22s, transform .22s var(--ease); }
  .vis.leaving .stage{ opacity:0; filter:blur(8px); transform:scale(.98); }
  @keyframes stageIn{ from{ opacity:0; filter:blur(8px); transform:scale(.985); } }

  .panel{ flex:1; min-height:0; display:flex; flex-direction:column; gap:24px; padding:16px 16px 8px; }
  .prog{ display:flex; gap:4px; }
  .seg{ position:relative; flex:1; height:4px; border:0; padding:0; border-radius:8px; background:var(--ink-16); cursor:pointer; overflow:hidden; }
  .seg::after{ content:""; position:absolute; inset:-10px 0; }
  .seg i{ position:absolute; inset:0; background:var(--green-bright); transform:scaleX(0); transform-origin:left; transition:transform .55s var(--ease); }
  .seg.on i{ transform:scaleX(1); }
  .copy{ flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:8px; }
  .lab{ font:600 10px/12px var(--f-eyebrow); letter-spacing:1.44px; text-transform:uppercase; color:var(--ink-64); }
  .ttl{ margin:0; font:700 24px/28px var(--f-display); color:var(--ink); letter-spacing:-.01em; }
  .ttl em{ font-style:normal; color:var(--green-dark); }
  .w{ display:inline-block; overflow:hidden; vertical-align:top; padding-bottom:2px; margin-bottom:-2px; }
  .w > span{ display:inline-block; }
  .ttl.reveal .w > span{ animation:wordUp .6s var(--ease) backwards; animation-delay:calc(var(--wi) * 50ms); }
  @keyframes wordUp{ from{ transform:translateY(110%); opacity:0; } }
  .txt{ margin:0; font:500 14px/20px var(--f-display); color:var(--ink-64); }
  .txt.reveal{ animation:fadeUp .5s var(--ease) .15s backwards; }
  .trust{ display:flex; gap:8px; align-items:center; margin-top:4px; padding:8px 12px; background:var(--green-8); border-radius:8px; font:600 12px/16px var(--f-display); color:var(--green-dark); }
  .trust.reveal{ animation:fadeUp .5s var(--ease) .25s backwards; }
  .trust .ic{ width:16px; height:16px; flex:none; }
  .btns{ display:flex; gap:8px; }
  .btn{ flex:1; border:0; border-radius:24px; padding:12px 16px; font:700 10px/12px var(--f-display); letter-spacing:.88px; text-transform:uppercase; cursor:pointer; transition:transform .12s, background-color .2s, filter .2s; }
  .btn:active{ transform:scale(.97); }
  .btn.prev{ background:var(--ink-8); color:var(--ink-64); }
  .btn.next{ background:var(--green-24); color:var(--green); }
  .btn.next.invest{ background:var(--primary); color:#fff; }
  button:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

  /* ---------- shared ---------- */
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } }
  @keyframes ring{ from{ transform:scale(1); opacity:.9; } to{ transform:scale(2); opacity:0; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .ic{ display:block; width:20px; height:20px; flex:none; }
  .ic path, .ic circle, .ic rect{ stroke-width:1.6; }      /* thinner line, like the references */
  .av{ width:100%; aspect-ratio:1; border-radius:50%; overflow:hidden; }
  .av svg{ display:block; width:100%; height:100%; }
  .wcard{ background:#fff; border-radius:16px; box-shadow:var(--card-shadow); }
  .eyebrow{ font:600 10px/12px var(--f-eyebrow); letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-64); }
  .chip{ font:700 10px/12px var(--f-display); letter-spacing:.5px; text-transform:uppercase; padding:3px 8px; border-radius:8px; white-space:nowrap; }
  .chip.ok{ background:var(--green-16); color:var(--green-dark); }
  .chip.blue{ background:var(--primary-16); color:var(--primary); }
  /* Swap: content crossfades through a short blur (as in the network-flow reference). */
  .swap{ transition:opacity .25s, filter .25s, transform .3s var(--ease); }
  .swap.out{ opacity:0; filter:blur(6px); transform:translateY(-4px); }
  /* Spinner → check, shared by step 1's card and step 3's button */
  .spin{ width:18px; height:18px; border-radius:50%; border:2px solid var(--ink-16); border-top-color:var(--ink); animation:spin .8s linear infinite; }
  .okdot{ width:18px; height:18px; border-radius:50%; background:var(--green-bright); display:flex; align-items:center; justify-content:center; animation:pop .35s var(--ease); }
  .okdot svg{ width:10px; height:10px; }
  @keyframes pop{ from{ transform:scale(.4); opacity:0; } }
  .tap{ position:absolute; left:0; top:0; width:28px; height:28px; margin:-14px 0 0 -14px; z-index:30; pointer-events:none; opacity:0; transition:transform .8s var(--ease), opacity .3s; }
  .tap.show{ opacity:1; }
  .tap::before{ content:""; position:absolute; inset:0; border-radius:50%; background:rgba(41,45,54,.22); border:2px solid #fff; box-shadow:0 2px 6px rgba(41,45,54,.24); transition:transform .15s var(--ease); }
  .tap.press::before{ transform:scale(.8); }
  .tap.press::after{ content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--primary); animation:ring .6s var(--ease) forwards; }
  /* Rolling digits with a touch of motion blur while they move (motion-study reference). */
  .odo{ display:inline-flex; align-items:baseline; font-variant-numeric:tabular-nums; line-height:1.1; }
  .od{ display:inline-block; width:.62em; height:1.1em; overflow:hidden; position:relative; transition:width .35s var(--ease); }
  .od.blank{ width:0; }
  .odc{ display:flex; flex-direction:column; transition:transform .9s var(--ease), filter .3s; }
  .odc i{ display:block; height:1.1em; line-height:1.1em; font-style:normal; text-align:center; }
  .od.mv .odc{ filter:blur(1.4px); }
  .os{ display:inline-block; overflow:hidden; white-space:pre; width:var(--w,.32em); transition:width .35s, opacity .35s; }
  .os.hide{ width:0; opacity:0; }

  /* =================== STEP 1 : checks as a flow (network-flow reference) =================== */
  .v1{ display:flex; flex-direction:column; align-items:center; padding:28px 16px 16px; height:100%; }
  .fpill{ position:relative; z-index:2; display:flex; align-items:center; gap:8px; height:40px; padding:0 14px 0 6px; background:#fff; border-radius:999px; box-shadow:var(--card-shadow); overflow:hidden; white-space:nowrap; transition:width .55s var(--ease-io), background-color .4s; }
  .fpill .pav{ width:28px; height:28px; flex:none; }
  .fpill .pt{ font:600 13px/16px var(--f-display); color:var(--ink); }
  .fpill .pt b{ color:var(--green-dark); }
  .fpill .tail{ width:16px; height:16px; display:flex; align-items:center; justify-content:center; }
  .fpill .tail .spin{ width:14px; height:14px; }
  .fpill .tail .okdot{ width:16px; height:16px; }
  .tree{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:visible; }
  .tree .base{ fill:none; stroke:var(--ink-8); stroke-width:1.5; }
  .tree .live{ fill:none; stroke:var(--ink); stroke-width:1.5; stroke-linecap:round; transition:stroke .5s; }
  .tree .live.done{ stroke:rgba(98,175,29,.55); }
  .tree .head{ fill:var(--ink); stroke:#fff; stroke-width:2; transition:opacity .3s; }
  .nodes{ position:relative; z-index:2; display:flex; gap:12px; margin-top:auto; margin-bottom:20px; }
  .node{ position:relative; width:52px; height:52px; border-radius:14px; background:#fff; border:1.5px solid var(--ink-8); color:var(--ink-24);
         display:flex; align-items:center; justify-content:center; transition:border-color .35s, color .35s, box-shadow .35s, transform .45s var(--ease); }
  .node .ic{ width:22px; height:22px; }
  .node.act{ border-color:var(--ink); color:var(--ink); box-shadow:0 6px 16px rgba(41,45,54,.14); transform:translateY(-2px); }
  .node.done{ border-color:rgba(98,175,29,.5); color:var(--green-dark); }
  .node .nb{ position:absolute; right:-5px; top:-5px; width:16px; height:16px; border-radius:50%; background:var(--green-bright); border:2px solid #fff; display:flex; align-items:center; justify-content:center; transform:scale(0); transition:transform .35s var(--ease); }
  .node .nb svg{ width:8px; height:8px; }
  .node.done .nb{ transform:scale(1); }
  .fcard{ position:relative; z-index:2; width:100%; padding:14px 16px 16px; }
  .fc-top{ display:flex; align-items:center; gap:10px; }
  .fc-st{ width:18px; height:18px; display:flex; align-items:center; justify-content:center; flex:none; }
  .fc-t{ flex:1; font:600 15px/20px var(--f-display); color:var(--ink); }
  .fc-n{ font:600 11px/14px var(--f-display); color:var(--ink-48); font-variant-numeric:tabular-nums; }
  .fc-d{ margin:6px 0 0 28px; font:500 13px/18px var(--f-display); color:var(--ink-64); min-height:36px; }
  .fmeter{ display:flex; gap:4px; margin:12px 0 0 28px; }
  .fmeter i{ flex:1; height:3px; border-radius:3px; background:var(--ink-8); position:relative; overflow:hidden; }
  .fmeter i::after{ content:""; position:absolute; inset:0; background:var(--green-bright); transform:scaleX(0); transform-origin:left; transition:transform .5s var(--ease); }
  .fmeter i.on::after{ transform:scaleX(1); }

  /* =================== STEP 2A : carousel =================== */
  @keyframes itIn{ from{ opacity:0; } }
  .v2{ height:100%; display:flex; flex-direction:column; justify-content:center; gap:22px; padding-bottom:6px; }
  .dcard{ margin:0 16px; background:linear-gradient(180deg, rgba(0,81,122,.72), #00517A); border-radius:16px; padding:18px 20px 20px; min-height:164px; color:#fff; box-shadow:var(--card-shadow); }
  .dreg{ display:flex; align-items:center; gap:4px; color:rgba(255,255,255,.64); min-height:14px; margin-bottom:8px; }
  .dreg .ic{ width:14px; height:14px; }
  .dtxt{ font:500 16px/22px var(--f-display); color:rgba(255,255,255,.64); }
  .dtxt b{ color:#fff; font-weight:700; }
  .chg{ animation:chgIn .35s var(--ease) backwards; }
  @keyframes chgIn{ from{ opacity:0; filter:blur(6px); transform:translateY(6px); } }
  .car{ position:relative; height:132px; overflow:hidden; cursor:grab; touch-action:pan-y; user-select:none; -webkit-user-select:none; flex:none; }
  .trk{ position:absolute; left:0; top:26px; display:flex; gap:14px; transition:transform .9s var(--ease); will-change:transform; }
  .trk.drag{ transition:none; }
  .trk.noanim .it{ transition:none !important; }
  .it{ position:relative; width:64px; height:64px; flex:none; border-radius:50%; box-shadow:0 4px 16px rgba(41,45,54,.16); transition:transform .5s var(--ease), box-shadow .4s; animation:itIn .5s ease backwards; animation-delay:calc(var(--d, 0) * 45ms); }
  .it .av{ height:100%; box-shadow:0 0 0 2px #fff; }
  .it.act{ transform:scale(1.3); box-shadow:0 8px 24px rgba(41,45,54,.24); z-index:2; }
  .rg{ position:absolute; inset:-5px; width:calc(100% + 10px); height:calc(100% + 10px); transform:rotate(-90deg); pointer-events:none; opacity:0; }
  .rg circle{ fill:none; stroke:var(--primary); stroke-width:2.4; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; }
  .it.auto .rg{ opacity:1; }
  .it.auto .rg circle{ animation:rgFill 2.6s linear forwards; }
  @keyframes rgFill{ to{ stroke-dashoffset:0; } }

  /* =================== STEP 2B : story =================== */
  .v2b{ height:100%; padding:14px; display:flex; }
  .stc{ position:relative; flex:1; min-height:0; padding:12px 14px 14px; display:flex; flex-direction:column; overflow:hidden; cursor:pointer; user-select:none; -webkit-user-select:none; }
  .sgs{ display:flex; gap:4px; margin-bottom:12px; }
  .sg{ flex:1; height:3px; border-radius:2px; background:var(--ink-8); overflow:hidden; }
  .sg i{ display:block; height:100%; width:0; background:var(--ink); }
  .sg.done i{ width:100%; }
  .sg.on i{ animation:sgFill 3.6s linear forwards; }
  .v2b.paused .sg.on i{ animation-play-state:paused; }
  @keyframes sgFill{ to{ width:100%; } }
  .sh{ display:flex; align-items:center; gap:10px; }
  .sh .pav{ width:40px; height:40px; flex:none; }
  .sh-t b{ display:block; font:700 14px/18px var(--f-display); color:var(--ink); }
  .sh-t span{ display:flex; align-items:center; gap:3px; font:500 12px/16px var(--f-display); color:var(--ink-64); }
  .sh-t span .ic{ width:13px; height:13px; }
  .sh .chip{ margin-left:auto; }
  .slides{ position:relative; flex:1; min-height:140px; margin-top:12px; }
  /* Segmented control with a sliding pill (motion-study reference). */
  .tabs3{ position:relative; display:flex; background:var(--bg-grey); border-radius:999px; padding:3px; margin-top:12px; }
  .tabs3 button{ position:relative; z-index:1; flex:1; border:0; background:transparent; font:600 12px/16px var(--f-display); color:var(--ink-64); padding:7px 0; cursor:pointer; transition:color .3s; }
  .tabs3 button.on{ color:#fff; }
  .ind{ position:absolute; top:3px; bottom:3px; left:3px; width:calc((100% - 6px) / 3); transition:transform .5s var(--ease-io); }
  .ind i{ display:block; height:100%; border-radius:999px; background:var(--ink); }
  .sl{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; opacity:0; filter:blur(6px); transform:translateX(18px); transition:opacity .4s, filter .4s, transform .5s var(--ease); pointer-events:none; }
  .sl.on{ opacity:1; filter:none; transform:none; }
  .sl.off{ transform:translateX(-18px); }
  .hd{ font:700 20px/24px var(--f-display); margin:0 0 16px; color:var(--ink); letter-spacing:-.01em; }
  .pop{ opacity:0; transform:translateY(10px); transition:opacity .4s, transform .5s var(--ease); transition-delay:calc(var(--d) * 80ms + 160ms); }
  .sl.on .pop{ opacity:1; transform:none; }
  .tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tile4{ background:var(--green-8); border-radius:12px; padding:12px 10px; }
  .tile4 .ic{ width:18px; height:18px; color:var(--green-dark); margin-bottom:8px; }
  .tile4 b{ display:block; font:800 20px/24px var(--f-display); letter-spacing:-.01em; color:var(--green-dark); }
  .tile4 span{ display:block; font:500 12px/16px var(--f-display); color:var(--ink-64); margin-top:2px; }
  .famtile{ background:var(--green-8); border-radius:12px; padding:18px 10px 12px; display:flex; justify-content:center; gap:20px; align-items:flex-end; }
  .fp{ width:46px; text-align:center; }
  .fp svg{ width:46px; height:60px; display:block; }
  .fp .c{ fill:var(--ink-16); }
  .fp.her .c{ fill:var(--green); }
  .fl{ display:block; font:700 10px/12px var(--f-display); color:var(--ink-48); margin-top:6px; }
  .fp.her .fl{ color:var(--green-dark); }
  .why{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .why li{ display:flex; align-items:center; gap:10px; font:600 14px/18px var(--f-display); color:var(--ink); }
  .why .wi{ width:30px; height:30px; border-radius:10px; background:var(--green-8); color:var(--green-dark); display:flex; align-items:center; justify-content:center; flex:none; }
  .why .wi .ic{ width:17px; height:17px; }
  .sfoot{ border-top:1px solid var(--bg-grey); margin-top:8px; padding-top:12px; }
  .sf-top{ display:flex; justify-content:space-between; align-items:baseline; font:500 12px/16px var(--f-display); color:var(--ink-64); }
  .sf-top b{ color:var(--ink); font-weight:700; }
  .sf-bar{ height:6px; border-radius:8px; background:var(--ink-8); margin:8px 0 10px; overflow:hidden; }
  .sf-bar i{ display:block; height:100%; width:0; background:var(--green-bright); border-radius:8px; transition:width 1.2s var(--ease); }
  .sf-terms{ display:flex; justify-content:space-between; font:600 11px/14px var(--f-display); color:var(--ink-64); }

  /* =================== STEP 2C : browse many → pick one =================== */
  .v2c{ height:100%; display:flex; flex-direction:column; padding:12px 12px 0; }
  .fbar{ display:flex; gap:6px; flex:none; margin:0 -12px 8px; padding:2px 12px; overflow:hidden; }
  .fchip{ display:flex; align-items:center; gap:4px; font:600 12px/16px var(--f-display); color:var(--ink-64); background:#fff; border-radius:999px; padding:6px 10px; box-shadow:0 1px 2px rgba(41,45,54,.08); white-space:nowrap; transition:background-color .3s, color .3s; }
  .fchip .ic{ width:14px; height:14px; }
  .fchip.srch{ flex:1; color:var(--ink-32); }
  .fchip.on{ background:var(--ink); color:#fff; }
  /* Bleeds to the stage edges (padding added back on the list) so the lifted, scaled pick
     card and its outline aren't clipped at the sides. */
  .feed{ position:relative; flex:1; min-height:0; overflow:hidden; margin:0 -12px;
         -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 32px), transparent 100%);
                 mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 32px), transparent 100%); }
  .flist{ display:flex; flex-direction:column; gap:8px; padding:8px 12px 48px; will-change:transform; }
  .pc{ display:flex; gap:10px; align-items:center; padding:10px 12px; background:#fff; border-radius:14px; box-shadow:var(--card-shadow);
       transition:opacity .4s, transform .45s var(--ease), filter .3s, box-shadow .4s; }
  .flist.fast .pc{ filter:blur(1.6px); }          /* motion blur while flicking */
  .pc .pav{ width:40px; height:40px; flex:none; }
  .pc-b{ flex:1; min-width:0; }

  const ic = (n, cls='') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON_PATHS[n]}</svg>`;

    const hair = (i % 2 === 0)

  /* Draw path i with a dot riding its tip (the "packet" in the reference). */
  function travel(i, ms, done){
    const path = $('#lv' + i), head = $('#head');
    if(!path) return;

    if(REDUCED){ path.setAttribute('stroke-dashoffset', 0); done && done(); return; }

    const t0 = performance.now();
    (function step(now){

  /* =========================== STEP 2 (A: carousel) =========================== */
  const PROFILES = [

      items.forEach((el, i) => { el.classList.toggle('act', i === a); if(i === autoIdx){ el.classList.add('auto'); } else el.classList.remove('auto'); });

      txt:`Read about their business goals and their lives, and see exactly what the investment will be used for.`,
      aria:() => s2v === 2 ? 'Animation: a feed of real entrepreneur listings is scrolled through quickly, slows down, and one profile, Durga Chouhan, is tapped; her card expands into her full profile and she is selected.'
                : s2v ? 'Animation: Jonmani\'s story in three slides — her business, her life and what she needs — above her funding progress and investment terms.'
                     : 'Animation: a row of entrepreneur photos scrolls; the focused profile expands and the card above shows their region, name and what they need.',
      vis:() => [vis2, vis2b, vis2c][s2v](), play:() => [play2, play2b, play2c][s2v]() },
    { ttl:`Your investment is collected on the next <em>1st or 15th</em>`,
      txt:`Only for the entrepreneurs you choose. It reaches them within 24 hours.`,
      trust:'RBI-compliant, with a formal agreement.',
      aria:'Animation: an Invest button is tapped, turns into a spinner and a tick, then a pill showing it is scheduled for the 15th; other investors fill Jonmani\'s funding bar and the money reaches her within 24 hours.', vis:vis3, play:play3 },
    { ttl:`Follow along as your <em>money comes back</em> to you.`,
      txt:`Track every repayment and your returns in one place — and see how the entrepreneur's business grows.`,
      aria:'Animation: a returns card switches from one month to one year, the repayments total rolls up and the chart line draws; then the full Investment Summary fills in and Jonmani\'s success update appears.', vis:vis4, play:play4 }
  ];
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function wordsHTML(html){
    const tpl = document.createElement('template'); tpl.innerHTML = html;
    let wi = 0; const out = [];
    tpl.content.childNodes.forEach(node => {
      const em = node.nodeType === 1;
      node.textContent.split(/(\s+)/).forEach(part => {
        if(!part) return;
        if(/^\s+$/.test(part)){ out.push(' '); return; }
        out.push(`<span class="w"><span style="--wi:${wi++}">${em ? `<em>${esc(part)}</em>` : esc(part)}</span></span>`);
      });
    });
    return out.join('');
  }
  let step = 0, goTok = 0, firstRender = true;
  function go(n){
    clearSched();
    step = n;
    $$('.seg').forEach((s, i) => s.classList.toggle('on', i <= n));
    $('#lab').textContent = 'Step ' + (n + 1);
    const ttl = $('#ttl'); ttl.innerHTML = wordsHTML(STEPS[n].ttl); restart(ttl, 'reveal');
    const txt = $('#txt'); txt.textContent = STEPS[n].txt; restart(txt, 'reveal');
    const tr = $('#trust'); tr.hidden = !STEPS[n].trust; $('#trustTxt').textContent = STEPS[n].trust || ''; if(STEPS[n].trust) restart(tr, 'reveal');
    $('#vsw').hidden = n !== 1;
    $('#prev').style.display = n === 0 ? 'none' : 'block';
    $('#next').textContent = n === 3 ? 'Invest' : 'Next';
    $('#next').classList.toggle('invest', n === 3);
    const tok = ++goTok, vis = $('#vis');
    const swap = () => {
      if(tok !== goTok) return;
      vis.className = 'vis';
      const a = STEPS[n].aria; vis.setAttribute('aria-label', typeof a === 'function' ? a() : a);
      vis.innerHTML = STEPS[n].vis();
      STEPS[n].play();
    };
    if(firstRender || REDUCED){ firstRender = false; swap(); }
    else { vis.classList.add('leaving'); setTimeout(swap, 220); }
  }
  $('#trustIc').outerHTML = ic('shield-check');
  const prog = $('#prog');
  for(let i = 0; i < 4; i++){
    const b = document.createElement('button');
    b.className = 'seg'; b.type = 'button'; b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.innerHTML = '<i></i>'; b.addEventListener('click', () => go(i)); prog.appendChild(b);
  }
  $('#prev').addEventListener('click', () => { if(step > 0) go(step - 1); });
  $('#next').addEventListener('click', () => { if(step < 3) go(step + 1); else window.open('https://rangde.in', '_blank', 'noopener'); });
  $('#rp').addEventListener('click', () => go(step));
  $$('#vsw button').forEach(b => b.addEventListener('click', () => {
    s2v = +b.dataset.v; $$('#vsw button').forEach(x => x.classList.toggle('on', x === b)); go(1);
  }));
  window.addEventListener('resize', () => {
    if(step === 1 && !s2v && s2Recenter) s2Recenter();
    if(step === 0 && $('#v1')) buildTree();
  });
  /* Start once fonts are in (step 1 measures the pill to draw its lines), but never after
     the viewer has already navigated, and never later than 1.2s. */
  let started = false;
  const start = () => { if(!started){ started = true; go(0); } };
  ['#prev', '#next', '#rp'].forEach(s => $(s).addEventListener('click', () => { started = true; }, { capture:true }));
  prog.addEventListener('click', () => { started = true; }, { capture:true });
  if(document.fonts) document.fonts.ready.then(start);
  setTimeout(start, 1200);
})();
</script>
</body>
</html>
