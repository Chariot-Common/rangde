<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rang De – Kisan Credit Card card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
  /* ---- Settings (Rang De Design System v3) ---- */
  :root {
    color-scheme: light;
    --page-bg: #E9E7E1;
    --card-bg: #FFFFFF;
    --card-border: #E4E1DA;
    --visual-bg: #F1F2F5;
    --text-grey: 41, 45, 54;      /* Text Grey, used at 8 / 16 / 64 / 100% */
    --primary: 13, 170, 222;      /* Primary, used at 24 / 100% */
    --ink: #292D36;               /* Text Grey/100 */
    --muted: #5F6370;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --page-bg: #1B1D23; } /* the card keeps its light design */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    background: var(--page-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    width: 400px;
    max-width: calc(100vw - 32px);
    height: 600px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: var(--ink);
  }
  .visual {
    height: 400px;
    flex: none;
    background: var(--visual-bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bar {
    position: relative;
    width: 254px;
    height: 320px;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .empty { flex-grow: 1; background: rgba(var(--text-grey), 0.08); }
  .fill { flex: none; height: 0; background: rgba(var(--primary), 1); }

  .stat { position: absolute; color: var(--ink); }
  .stat-top { left: 16px; top: 16px; opacity: 0; }
  .stat-bottom {
    left: 16px;
    bottom: 0;
    color: #FFFFFF;
    transform: scale(0);
    transform-origin: 0 100%;
  }
  .num {
    font-size: 44px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .label {
    margin-top: 6px;
    font-size: 12px;
    line-height: 1.3;
    white-space: nowrap;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  /* Slot-machine counter */
  .odometer { display: flex; align-items: flex-start; line-height: 1.1; }
  .odometer .col { display: block; flex: none; height: 1.1em; overflow: hidden; }
  .odometer .strip { display: flex; flex-direction: column; }
  .odometer .strip span { display: block; height: 1.1em; }
  .odometer .tens { max-width: 0; }
  .stat-bottom .label { margin-top: 4px; }
  .label.sub { margin-top: 0; opacity: 0.64; }

  .copy {
    height: 200px;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .copy h2 { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
  .copy p { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
</style>
<style>
  /* Added when copied into the teardrop page: the card sits in a 400 x 600 iframe there */
  :root { color-scheme: light !important; }
  html, body { background: transparent !important; }
  .card { max-width: none !important; }
</style>
</head>
<body>

<article class="card">
  <div class="visual" role="img" aria-label="Bar chart: 44% of farming households have a Kisan Credit Card; 56% don’t.">
    <div class="bar" aria-hidden="true">
      <div class="empty" id="empty"></div>
      <div class="fill" id="fill"></div>

      <div class="stat stat-top" id="top">
        <div class="num">56%</div>
        <div class="label">farming households don’t have a KCC</div>
        <div class="label sub">(Kisan Credit Card)</div>
      </div>

      <div class="stat stat-bottom" id="bottom">
        <div class="num odometer">
          <span class="col tens" id="tensCol"><span class="strip" id="tens">
            <span></span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>
          </span></span>
          <span class="col"><span class="strip" id="ones">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span>
          </span></span>
          <span class="col">%</span>
        </div>
        <div class="label">farming households have a KCC</div>
        <div class="label sub">(Kisan Credit Card)</div>
      </div>
    </div>
  </div>
  <div class="copy">
    <h2>Fewer than half of farming households have access to India’s main farm-credit scheme.</h2>
    <p>Source: NABARD, All India Rural Financial Inclusion Survey (2021–22)</p>
  </div>
</article>

<script>
(function () {
  // ---- Settings ----
  var LOOP = true;          // false = play once and hold the final frame
  var FINAL = 44;           // NABARD NAFIS 2021–22: 44.1% hold a valid Kisan Credit Card
  var T0 = 0.4;             // count starts
  var COUNT = 3.0;          // seconds from 0% to the final figure
  var AFTER = 1.5;          // seconds for the fades after the count
  var BLINK = 1.6;          // seconds for the two blinks of the empty part

  var T1 = T0 + COUNT, T2 = T1 + AFTER, END = T2 + 0.2, CYCLE = T2 + 3.5;

  var empty = document.getElementById('empty');
  var fill = document.getElementById('fill');
  var top = document.getElementById('top');
  var bottom = document.getElementById('bottom');
  var tensCol = document.getElementById('tensCol');
  var tens = document.getElementById('tens');
  var ones = document.getElementById('ones');

  function clamp(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
  function easeInOut(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }

  function render(t) {
    // Count up like a slot machine: fast, then settling on the final figure
    var v = FINAL * easeOut(clamp((t - T0) / COUNT));
    var o = v - 10 * Math.floor(v / 10);
    var tn = Math.floor(v / 10) + clamp(o - 9); // tens rolls as the ones pass 9 → 0
    ones.style.transform = 'translateY(' + (-o * 1.1) + 'em)';
    tens.style.transform = 'translateY(' + (-tn * 1.1) + 'em)';
    tensCol.style.maxWidth = (0.7 * clamp(tn)) + 'em';
    fill.style.height = v + '%';
    // The 44% text grows with the fill so it always sits inside the blue
    bottom.style.transform = 'scale(' + (v / FINAL) + ')';
    bottom.style.bottom = (16 * v / FINAL) + 'px';

    // After the count: number fades, blue dims to Primary/24, empty part blinks Text Grey/8 → 16 → 8, twice
    var f = clamp((t - T1) / AFTER);
    var b = clamp((t - T1) / BLINK);
    var grey = 0.08 + 0.08 * (1 - Math.cos(2 * Math.PI * 2 * b)) / 2;
    var blue = 1 - 0.76 * easeInOut(f);
    var a = easeOut(f);
    var fade = LOOP ? 1 - clamp((t - (CYCLE - 0.45)) / 0.4) : 1;

    empty.style.background = 'rgba(var(--text-grey),' + (grey * fade + 0.08 * (1 - fade)) + ')';
    fill.style.background = 'rgba(var(--primary),' + (blue * fade) + ')';
    bottom.style.opacity = (1 - easeInOut(clamp((t - T1) / 1.1))) * fade;
    top.style.opacity = a * fade;
    top.style.transform = 'translateY(' + (10 * (1 - a)) + 'px)';
  }

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    render(END);
    return;
  }

  var start = null;
  function tick(now) {
    if (start === null) start = now;
    var t = (now - start) / 1000;
    if (LOOP && t > CYCLE) { start = now; t = 0; }
    else if (!LOOP && t > END) t = END;
    render(t);
    requestAnimationFrame(tick);
  }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
    .then(function () { requestAnimationFrame(tick); });
})();
</script>
</body>
</html>
