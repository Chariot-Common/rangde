<title>Teardrop concept · Rang De</title>
<!--
  TEARDROP CONCEPT (homepage hero, problem-first)
  Figma: Rang De Master Design III, frame "Emphasis Dark to White Concept" (node 3041:185)
  https://www.figma.com/design/OOGgv2xrymOeuLapDwdZMV/Rang-De-Master-Design-III?node-id=3041-185

  One continuous camera move, scrubbed by scroll (2 screens of scrolling):
    - Hero: "65% of India's Population / Faces a silent epidemic", portrait cropped above the nose.
    - The camera glides straight from the hero into the tear under her eye while zooming in.
      Her face slides bottom -> top behind the tear; the mouth never enters the frame.
    - The tear is a glass layer in front of the face (Figma "Glass" effect: frost 4,
      refraction 1, dispersion 0.85, white fill 12%). It shows early, and the glass gets
      stronger as you scroll. The tear grows faster than the face (parallax), then fills
      the screen and turns pure white.

  Open directly in a browser (double-click). Add ?debug to the URL to see scroll progress.
  Tune it in the CONFIG object in the script below.
-->

  }

    :root {
      --font-size-h2: 34px;
      --line-height-h2: 36px;

  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--color-text-grey-100); }
  body { font-family: var(--font-family-base); -webkit-font-smoothing: antialiased; }

  /* Scroll track: 1 screen for the pinned stage + 2 screens of scrolling for the move */
  .track { position: relative; height: 300vh; }

  .stage {
    position: sticky; top: 0;
    height: 100vh; height: 100svh;
    overflow: hidden;
    background: var(--color-text-grey-100);
  }

  .face, .lens-img {
    position: absolute; left: 0; top: 0;
    width: 845px; height: 916px;               /* native portrait size (design units) */
    transform-origin: 0 0;
    pointer-events: none; user-select: none;
    max-width: none;
  }
  .face { display: block; }

  /* The tear, drawn at 10x (140 x 282) so it stays crisp when scaled up */
  .tear {
    position: absolute; left: 0; top: 0;
    width: 140px; height: 282px;
    transform-origin: 0 0;
    pointer-events: none;
    opacity: 0;
  }
  .tear > svg { position: absolute; inset: 0; width: 140px; height: 282px; overflow: visible; }
  /* Glass lens: a magnified, frosted view of the face behind, clipped to the tear */
  .lens {
    position: absolute; inset: 0;
    clip-path: path("M70 0C109.907 90.2228 139.558 149.417 140 198.213C140 307.68 0 306.843 0 198.213C1.01863 150.157 31.5112 90.5526 70 0Z");
    overflow: hidden;
    background: var(--color-text-grey-100);
  }

  /* Hero copy (screen space so it wraps on small screens) */
  .copy {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 16px;
    text-align: center;
    pointer-events: none;
  }
  .copy h1 {
    margin: 0;
    color: var(--color-white-100);
    font-weight: var(--font-weight-black);
    font-size: clamp(40px, min(6.4vw, 10.5vh), var(--hero-title-size));
    line-height: calc(var(--hero-title-line) / var(--hero-title-size)); /* 94 / 92 */
    letter-spacing: 0;
    font-feature-settings: "dlig" 1, "lnum" 1, "pnum" 1;
  }
  .copy p {
    margin: 0.4em 0 0;
    color: var(--color-red-100);
    font-weight: var(--font-weight-bold);
    font-size: var(--font-size-h2);
    line-height: var(--line-height-h2);
    letter-spacing: var(--letter-spacing-h2);
  }

  .flash {
    position: absolute; inset: 0;
    background: var(--color-white-100);
    opacity: 0;
    pointer-events: none;
  }

  .after {
    min-height: 100vh;
    background: var(--color-white-100);
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 30vh;
    color: var(--color-text-grey-64);
    font-size: var(--font-size-p2);
    font-weight: var(--font-weight-medium);
  }

  .debug {
    position: fixed; right: 12px; bottom: 12px; z-index: 10;
    padding: 6px 10px; border-radius: 6px;
    background: var(--color-text-grey-100); color: var(--color-white-64);
    font: var(--font-weight-medium) var(--font-size-h6)/1.4 ui-monospace, Consolas, monospace;
    display: none;
  }
</style>

<script>
(() => {
  // ---------------------------------------------------------------------------
  // Portrait landmarks (portrait design units; the SVG is 845 x 916)
  // ---------------------------------------------------------------------------
  const PORTRAIT_W = 845;
  // Tear under her right eye (viewer's left). Figma Polygon 2 sits at frame (623, 729),
  // portrait at (297, 425), so the tear tip is at (333, 304).
  const TEAR_TIP = { x: 333, y: 304 };
  const BULGE = { x: 7, y: 20.6 };      // centre of the round part, in tear units (14 x 28.2)
  const NOSE_HIDE_Y = 348;               // first frame ends above the crease over the nostrils
  const MOUTH_SAFE_Y = 418;              // the frame never goes below this (top lip is ~429)

  const CONFIG = {
    portraitScale: 1.4,   // the lady, relative to the previous build
    fall: 45,             // design units the tear runs down her cheek (stays above the mouth)
    zoom: 8,              // how far the camera pushes into the face by the end
    tearShowBy: 0.12,     // the tear is fully visible by this point of the scroll
    milkFrom: 0.72,       // the glass starts turning white here...
    whiteBy: 0.97,        // ...and the whole screen is white here
  };

  const $ = (id) => document.getElementById(id);
  const track = $("track"), stage = $("stage"), face = $("face"), tear = $("tear"), lensImg = $("lensImg");
  const copy = $("copy"), flash = $("flash"), debug = $("debug");
  const shadow = $("tearShadowPath"), gWhite = $("glassWhite"), gRim = $("glassRim"),
        gDisp = $("glassDispersion"), gDepth = $("glassDepth"), gGlint = $("glassGlint"), gGlint2 = $("glassGlint2");
  // The lens shows a frosted copy of the face. Redrawing the vector portrait twice per frame
  // is expensive, so the lens uses a 2x bitmap of it (sharpness doesn't matter under frost).
  lensImg.src = face.src;
  (face.decode ? face.decode() : Promise.resolve()).then(() => {
    const c = document.createElement("canvas");
    c.width = 845 * 2; c.height = 916 * 2;
    c.getContext("2d").drawImage(face, 0, 0, c.width, c.height);
    c.toBlob((blob) => { if (blob) lensImg.src = URL.createObjectURL(blob); });
  }).catch(() => {});

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const smooth = (a, b, t) => { const p = clamp((t - a) / (b - a)); return p * p * (3 - 2 * p); };
  // one curve for the whole move, no stops in between
  const ease = (p) => 0.7 * p + 0.3 * (0.5 - 0.5 * Math.cos(Math.PI * p)); // responds from the first pixel of scroll

  let W = 0, H = 0, base = 1;

  function measure() {
    W = stage.clientWidth;
    H = stage.clientHeight;
    base = CONFIG.portraitScale * Math.min((0.55 * H) / 560, W / 460);
    // the copy sits in the space above the portrait in the first frame
    const portraitTop = H - NOSE_HIDE_Y * base;
    copy.style.height = `${Math.max(portraitTop, 0.4 * H)}px`;
  }

  function render(t) {
    const e = ease(t);
    const form = smooth(0, CONFIG.tearShowBy, t);

    // tear (bulge centre) in portrait units: emerges from under the lid, then runs down
    const tearX = TEAR_TIP.x + 2 * e;
    const tearY = TEAR_TIP.y + BULGE.y - 6 * (1 - form) + CONFIG.fall * e;
    const tearYEnd = TEAR_TIP.y + BULGE.y + CONFIG.fall;

    // zoom: geometric, so it feels even; push far enough that the mouth stays out at the end
    const zoomEnd = Math.max(CONFIG.zoom, (H / 2) / (base * (MOUTH_SAFE_Y - tearYEnd)));
    const S = Math.pow(zoomEnd, e);
    const fs = base * S;

    // camera: the tear glides in a straight line from where it starts on screen to the
    // centre while the camera zooms (zoom-toward-point). The face slides up behind it.
    const c0x = PORTRAIT_W / 2;
    const c0y = NOSE_HIDE_Y - (H / 2) / base;
    const k0 = (1 - e) / S;
    let cx = tearX - (tearX - c0x) * k0;
    let cy = tearY - (tearY - c0y) * k0;
    cy = Math.min(cy, MOUTH_SAFE_Y - (H / 2) / fs);   // the mouth never enters the frame

    const fx = W / 2 - cx * fs, fy = H / 2 - cy * fs;
    face.style.transform = `translate3d(${fx}px, ${fy}px, 0) scale(${fs})`;

    // tear layer in front: grows faster than the face (parallax), then fills the screen
    const fillScale = (1.3 * Math.hypot(W, H)) / 14;          // px per tear unit to cover the screen
    const kEnd = Math.max(1, fillScale / (base * zoomEnd));
    const k = Math.pow(kEnd, e * e * e);
    const tearScale = fs * k * lerp(0.45, 1, form);           // px per tear unit
    const sx = W / 2 + (tearX - cx) * fs, sy = H / 2 + (tearY - cy) * fs;
    const s = tearScale / 10;                                 // the element is drawn at 10x
    const tx = sx - BULGE.x * 10 * s, ty = sy - BULGE.y * 10 * s;
    tear.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${s})`;
    tear.style.opacity = form.toFixed(3);

    // --- glass: refraction (magnified face), frost, rim, dispersion; all build with scroll ---
    const g = e;                                              // glass prominence
    const m = lerp(1.18, 1.65, g);                            // refraction magnification
    const lc = { x: 70, y: 206 };                             // lens centre (bulge) in tear px
    const ls = (m * fs) / s;
    const lx = lc.x * (1 - m) + (m * (fx - tx)) / s;
    const ly = lc.y * (1 - m) + (m * (fy - ty)) / s;
    lensImg.style.transform = `translate3d(${lx}px, ${ly}px, 0) scale(${ls})`;
    const tearWidthPx = 14 * tearScale;
    const frostPx = clamp(tearWidthPx * lerp(0.05, 0.035, g), 0.6, 18); // Figma frost 4 on a 14px drop
    lensImg.style.filter = `blur(${(frostPx / (m * fs)).toFixed(4)}px) brightness(${lerp(1.12, 1.3, g).toFixed(3)}) saturate(${lerp(1.0, 1.1, g).toFixed(3)})`;

    const milk = smooth(CONFIG.milkFrom, CONFIG.whiteBy, t);
    gWhite.setAttribute("opacity", lerp(0.24, 1, milk).toFixed(3));   // Figma fill is white 12%; a little more reads as glass on skin
    gRim.setAttribute("opacity", lerp(0.55, 1, g).toFixed(3));
    gDisp.setAttribute("opacity", (lerp(0.2, 0.55, g) * (1 - milk)).toFixed(3)); // Figma dispersion 0.85
    gDepth.setAttribute("opacity", (lerp(0.45, 0.9, g) * (1 - milk)).toFixed(3));
    gGlint.setAttribute("opacity", lerp(0.6, 0.95, g).toFixed(3));
    gGlint2.setAttribute("opacity", lerp(0.35, 0.8, g).toFixed(3));
    const shadowOp = 0.28 * form * (1 - smooth(0.55, 0.8, t));
    shadow.style.display = shadowOp < 0.005 ? "none" : "";
    shadow.setAttribute("opacity", shadowOp.toFixed(3));

    // --- copy rides up with the face and fades, final white ---
    const lift = (H - NOSE_HIDE_Y * base) - (fy);              // how far the portrait top has moved up
    const copyOut = smooth(0, 0.1, t);
    copy.style.opacity = (1 - copyOut).toFixed(3);
    copy.style.transform = `translate3d(0, ${-Math.max(0, lift) * 0.6}px, 0)`;
    copy.style.visibility = copyOut >= 1 ? "hidden" : "visible";
    const white = smooth(CONFIG.whiteBy - 0.04, CONFIG.whiteBy, t);
    flash.style.opacity = white.toFixed(3);

    if (debugOn) debug.textContent = `t ${t.toFixed(3)}  zoom ${S.toFixed(2)}  tear ${(form * 100).toFixed(0)}%  glass ${(g * 100).toFixed(0)}%  white ${(milk * 100).toFixed(0)}%`;
  }

  // ---------------------------------------------------------------------------
  // Scroll -> progress, smoothed so the camera glides instead of stepping
  // ---------------------------------------------------------------------------
  const debugOn = new URLSearchParams(location.search).has("debug");
  if (debugOn) debug.style.display = "block";
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let target = 0, current = 0, last = performance.now(), rendered = -1;

  function readScroll() {
    const rect = track.getBoundingClientRect();
    const total = track.offsetHeight - H;
    target = clamp(-rect.top / total);
  }

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    current = reduceMotion ? target : lerp(current, target, 1 - Math.exp(-dt * 9));
    if (Math.abs(current - target) < 0.0002) current = target;
    if (current !== rendered) { render(current); rendered = current; }
    requestAnimationFrame(frame);
  }

  addEventListener("scroll", readScroll, { passive: true });
  addEventListener("resize", () => { measure(); readScroll(); render(current); });
  measure();
  readScroll();
  current = target;
  render(current);
  requestAnimationFrame(frame);

  // console helpers: teardrop.go(0.5) scrolls there, teardrop.render(0.5) jumps there
  window.teardrop = {
    go: (p) => { scrollTo(0, clamp(p) * (track.offsetHeight - H)); },
    render: (p) => { target = current = rendered = p; render(p); },
  };
})();
</script>
</body>
</html>
